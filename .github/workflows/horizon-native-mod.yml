name: Horizon native mod package

on:
  workflow_dispatch:
  push:
    branches:
      - utility-horizon-native-port
    paths:
      - "hmod/**"
      - "src/**"
      - "Cargo.toml"
      - "runtime.rs"
      - ".github/workflows/horizon-native-mod.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test portable Utility core
        run: cargo test --manifest-path hmod/core/Cargo.toml
      - name: Package native Horizon source mod
        working-directory: hmod
        run: |
          zip -r utilitymod-1.1.1.hmod horizon-mod.toml Cargo.toml src core
      - name: Upload .hmod source package
        uses: actions/upload-artifact@v4
        with:
          name: utilitymod-horizon-hmod
          path: hmod/utilitymod-1.1.1.hmod
          if-no-files-found: error
