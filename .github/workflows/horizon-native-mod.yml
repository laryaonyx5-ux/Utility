name: Horizon native mod source package

on:
  workflow_dispatch:
  push:
    branches:
      - utility-horizon-native-port
    paths:
      - "hmod/**"
      - "src/**"
      - "Cargo.toml"
      - "runtime.rs"
      - ".github/workflows/horizon-native-mod.yml"

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test portable Utility core
        run: cargo test --manifest-path hmod/core/Cargo.toml
      - name: Package installable Horizon source mod
        working-directory: hmod
        run: |
          zip -X -r "$GITHUB_WORKSPACE/utilitymod-1.1.1.hmod" horizon-mod.toml Cargo.toml src core assets -x "target/*" "core/target/*"
          if [ -f Cargo.lock ]; then
            zip -X "$GITHUB_WORKSPACE/utilitymod-1.1.1.hmod" Cargo.lock
          fi
      - name: Validate .hmod archive and native manifest
        run: |
          python - <<'PY'
          import tomllib
          import zipfile
          from pathlib import Path

          package = Path("utilitymod-1.1.1.hmod")
          with zipfile.ZipFile(package) as archive:
              assert archive.testzip() is None, "corrupt zip entry"
              names = set(archive.namelist())
              required = {
                  "horizon-mod.toml",
                  "Cargo.toml",
                  "src/lib.rs",
                  "src/hud.rs",
                  "src/mixins/fullbright_frame.rs",
                  "src/mixins/entity_vitals_frame.rs",
                  "core/Cargo.toml",
                  "core/src/lib.rs",
                  "core/src/runtime.rs",
                  "assets/utilitymod/lang/fr_fr.json",
              }
              missing = required - names
              assert not missing, f"missing package files: {sorted(missing)}"
              assert not any("/target/" in name or name.startswith("target/") for name in names), "build output leaked into package"
              manifest = tomllib.loads(archive.read("horizon-mod.toml").decode())
              assert manifest["id"] == "utilitymod"
              assert manifest["api"] == "0.2"
              assert len(manifest["native"]["mixin"]) == 2
          print(f"Validated {package} ({package.stat().st_size} bytes)")
          PY
      - name: Upload installable .hmod source package
        uses: actions/upload-artifact@v4
        with:
          name: utilitymod-horizon-hmod
          path: utilitymod-1.1.1.hmod
          if-no-files-found: error
