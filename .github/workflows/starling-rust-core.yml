name: Starling Rust core and package

on:
  push:
    branches:
      - starling-rust
  pull_request:
    branches:
      - starling-rust

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run core tests
        run: cargo test --all-targets
      - name: Package native mod
        run: bash scripts/package-starling.sh "${{ github.workspace }}/utilitymod-1.1.0.hnmod"
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: utilitymod-starling-hnmod
          path: utilitymod-1.1.0.hnmod
          if-no-files-found: error
