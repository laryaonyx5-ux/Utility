name: Starling Rust core

on:
  push:
    branches:
      - starling-rust
  pull_request:
    branches:
      - starling-rust

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run core tests
        run: cargo test --all-targets
